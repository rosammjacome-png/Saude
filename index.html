<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carregador de Arquivos - Bluesoft</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}
.card{
    background:#fff;
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    text-align:center;
    width:500px;
}
input{
    margin-top:20px;
}
#info{
    margin-top:20px;
    color:#555;
}
</style>
</head>
<body>
<div class="card">
    <h2>Carregar Arquivo para Bluesoft</h2>
    <p>Selecione o arquivo que será utilizado no processo de importação.</p>

    <input type="file" id="arquivo">

    <div id="info"></div>
</div>

<script>
document.getElementById('arquivo').addEventListener('change', function(){
    const file = this.files[0];
    if(file){
        document.getElementById('info').innerHTML =
            `<strong>Arquivo:</strong> ${file.name}<br>
             <strong>Tamanho:</strong> ${(file.size/1024).toFixed(2)} KB`;
    }
});
</script>
</body>
</html>
